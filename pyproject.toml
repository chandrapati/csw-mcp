[project]
name = "csw-mcp"
version = "0.1.0"
description = "Read-only MCP server for Cisco Secure Workload — natural-language cluster queries for Cursor / Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "csw-mcp contributors" }]
keywords = ["mcp", "cisco", "secure-workload", "tetration", "security", "microsegmentation"]
dependencies = [
    # Pinned to the 1.x line: this project targets the FastMCP API. mcp 2.x
    # renamed FastMCP -> MCPServer and changed internals the tooling relies on.
    "mcp>=1.0.0,<2",
]

[project.scripts]
csw-mcp = "csw_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/chandrapati/csw-mcp"
Repository = "https://github.com/chandrapati/csw-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csw_mcp"]
